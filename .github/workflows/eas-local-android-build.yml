name: EAS Local Android Build

# GitHub'ın ücretsiz ubuntu-latest runner'ında, EAS Cloud Build kotasını
# harcamadan Android build almak icin: `eas build --local` komutu, Android
# tarafinda Docker'a ihtiyaç duymadan doğrudan Gradle ile derleme yapar -
# ubuntu-latest imajinda Android SDK zaten kurulu geliyor.
#
# Gereken tek şey: Expo hesabinin bir "access token"i, GitHub repo
# ayarlarinda EXPO_TOKEN adiyla bir "Actions secret" olarak eklenmiş olmali
# (expo.dev -> hesap ayarlari -> Access Tokens -> Create).
#
# Actions sekmesinden bu workflow'a girip sağ üstteki "Run workflow"a
# basarak branch ve profil seçip elle tetikleyebilirsin.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "eas.json'daki build profili"
        required: true
        default: production
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Java kur (Android Gradle build için gerekli)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Bağımlılıkları kur
        run: npm install

      - name: EAS CLI kur
        run: npm install -g eas-cli

      - name: Expo hesabına giriş kontrolü
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Android build (local, EAS cloud kotası harcamadan)
        run: |
          eas build --local \
            --platform android \
            --profile ${{ github.event.inputs.profile }} \
            --non-interactive \
            --output ./sparkr-${{ github.event.inputs.profile }}.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: APK'yı indirilebilir artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: sparkr-android-${{ github.event.inputs.profile }}
          path: sparkr-${{ github.event.inputs.profile }}.apk
          retention-days: 14
